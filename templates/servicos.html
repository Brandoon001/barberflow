
{% extends "base.html" %}

{% block titulo %}Serviços | BarberFlow{% endblock %}

{% block conteudo %}
<section class="admin-dashboard">
    <h1>Cadastro de serviços</h1>
    <p>Cadastre os serviços oferecidos pela barbearia.</p>

    <form method="POST">
        <label for="nome">Nome do serviço</label>
        <input
            type="text"
            id="nome"
            name="nome"
            required
        >

        <label for="preco">Preço (R$)</label>
        <input
            type="number"
            id="preco"
            name="preco"
            min="0"
            step="0.01"
            required
        >

        <label for="duracao">Duração (minutos)</label>
        <input
            type="number"
            id="duracao"
            name="duracao"
            min="1"
            step="1"
            required
        >

        <label for="descricao">Descrição (opcional)</label>
        <textarea
            id="descricao"
            name="descricao"
        ></textarea>

        <button type="submit">Cadastrar serviço</button>
    </form>
</section>
{% endblock %}
