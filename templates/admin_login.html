
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login administrativo | BarberFlow</title>
</head>
<body>
    <main>
        <h1>BarberFlow</h1>
        <h2>Área administrativa</h2>

        {% if erro %}
            <p role="alert">{{ erro }}</p>
        {% endif %}

        <form method="POST">
            <label for="usuario">Usuário</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
                autocomplete="username"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                autocomplete="current-password"
                required
            >

            <button type="submit">Entrar</button>
        </form>

        <a href="{{ url_for('public.inicio') }}">Voltar ao início</a>
    </main>
</body>
</html>
